<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Zongo Ads</title>

    <style>

        /*
        =========================================================
        ZONGO CENTRAL ADS
        =========================================================

        This file stores all advertising units.

        The Zongo ad loader reads these units and places them
        around the content of each page.

        Do NOT place page-specific content here.
        =========================================================
        */

        .zongo-ad-unit {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        .zongo-ad-unit-inner {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
        }


        /* =====================================================
           EXOCLICK
        ===================================================== */

        .zongo-exoclick-1502127 {

            min-height: 90px;

        }


        .zongo-exoclick-1502123 {

            min-height: 90px;

        }


        .zongo-exoclick-1502124 {

            min-height: 90px;

        }


        .zongo-exoclick-1502125 {

            min-height: 90px;

        }


        .zongo-exoclick-1502126 {

            min-height: 90px;

        }


        /* =====================================================
           CLICKADILLA
        ===================================================== */

        .zongo-clickadilla {

            min-height: 100px;

        }


        /* =====================================================
           ADSTERRA
        ===================================================== */

        .zongo-adsterra-160x300 {

            width: 160px;
            min-height: 300px;

        }


        .zongo-adsterra-160x600 {

            width: 160px;
            min-height: 600px;

        }


        .zongo-adsterra-728x90 {

            width: 728px;
            min-height: 90px;

        }


        .zongo-adsterra-native {

            width: 100%;
            min-height: 250px;

        }


        .zongo-adsterra-300x250 {

            width: 300px;
            min-height: 250px;

        }


        .zongo-adsterra-320x50 {

            width: 320px;
            min-height: 50px;

        }


        .zongo-adsterra-468x60 {

            width: 468px;
            min-height: 60px;

        }


        /* =====================================================
           MANUAL ZONGO PARTNER ADS
        ===================================================== */

        .zongo-manual-ad {

            width: 100%;
            min-height: 100px;

            display: flex;
            justify-content: center;
            align-items: center;

            box-sizing: border-box;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 768px) {

            .zongo-adsterra-728x90 {

                width: 100%;
                min-height: 90px;

            }


            .zongo-adsterra-160x600 {

                width: 160px;
                min-height: 600px;

            }


            .zongo-adsterra-468x60 {

                width: 100%;
                min-height: 60px;

            }

        }


        @media (max-width: 480px) {

            .zongo-ad-unit {

                max-width: 100%;

            }


            .zongo-adsterra-300x250 {

                width: 300px;
                max-width: 100%;

            }


            .zongo-adsterra-320x50 {

                width: 320px;
                max-width: 100%;

            }


            .zongo-adsterra-468x60 {

                width: 100%;
                max-width: 100%;

            }

        }

    </style>

</head>
